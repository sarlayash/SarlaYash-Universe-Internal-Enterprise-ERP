<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="shortcut icon" href="./sarlayash_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SarlaYash Universe — Enterprise Portal | Powered By Kapil</title>

    <!-- PWA & Mobile Web App Meta Tags -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#050507" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SarlaYash ERP" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Tailwind CSS CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              sy: {
                black: '#050507',
                dark: '#0c0c11',
                card: '#121218',
                cardHover: '#181822',
                border: '#262633',
                red: {
                  light: '#ef4444',
                  DEFAULT: '#dc2626',
                  dark: '#991b1b',
                  velvet: '#7f1d1d',
                  glow: 'rgba(220, 38, 38, 0.35)'
                },
                gold: {
                  light: '#fef08a',
                  bright: '#ffd700',
                  DEFAULT: '#d4af37',
                  amber: '#f59e0b',
                  dark: '#996515',
                  glow: 'rgba(212, 175, 55, 0.35)'
                },
                white: '#ffffff',
                muted: '#94a3b8'
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Outfit', 'Inter', 'system-ui', 'sans-serif'],
              serif: ['Cinzel', 'Georgia', 'serif'],
            }
          }
        }
      }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050507] text-[#f8fafc] min-h-screen antialiased selection:bg-[#dc2626]/30 selection:text-[#ffd700] overscroll-none">
    <div id="root"></div>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => {
              console.log('[PWA] Service Worker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.log('[PWA] Service Worker registration failed:', error);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
